name: Build NetMuzzle APK & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala na ręczne uruchomienie w interfejsie GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build APKs and Google Play Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug/Release APKs and Google Play Bundle (.aab)
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Google Play Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-GooglePlay-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Optimized Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/NetMuzzle-v1.0.0.apk
          cp app/build/outputs/bundle/release/*.aab release-assets/NetMuzzle-v1.0.0.aab
          ls -lh release-assets/

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "NetMuzzle v1.0.0 (Official Release)"
          body: |
            ## 🛡️ NetMuzzle v1.0.0
            
            Ultra-lightweight, zero-CPU, no-root Android firewall.
            
            ### 📦 Pobierz / Download:
            - **[NetMuzzle-v1.0.0.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.0.0/NetMuzzle-v1.0.0.apk)** (~1 MB) — gotowa do bezpośredniej instalacji na smartfonie z Androidem (Android 8.0+ / Oreo do Android 14+).
            
            ### ✨ Kluczowe funkcje / Key Features:
            - 🔒 **Blokada aplikacji:** Odcina dostęp do internetu dla wybranych aplikacji (reklamy, telemetria, gry).
            - ⚡ **0% obciążenia CPU:** Ruch dozwolonych aplikacji omija silnik na poziomie jądra systemu Linux (kernel bypass).
            - 🔋 **Zero drenażu baterii:** Brak analizowania pakietów, brak deszyfrowania TLS/SSL, brak procesów w tle.
            - 🛡️ **Zero wycieków DNS:** Pętla blackhole sink pochłania zapytania DNS zablokowanych aplikacji.
            - 🌍 **Język polski i angielski:** Automatyczna lokalizacja.
            - 💎 **100% Free & Open Source:** Na licencji MIT.
          files: |
            release-assets/NetMuzzle-v1.0.0.apk
            release-assets/NetMuzzle-v1.0.0.aab

