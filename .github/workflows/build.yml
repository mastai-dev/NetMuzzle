name: Build NetMuzzle APK & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala na ręczne uruchomienie w interfejsie GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build APKs and Google Play Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug/Release APKs and Google Play Bundle (.aab)
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Google Play Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-GooglePlay-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Optimized Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/NetMuzzle-v1.3.0.apk
          cp app/build/outputs/bundle/release/*.aab release-assets/NetMuzzle-v1.3.0.aab
          ls -lh release-assets/

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "NetMuzzle v1.3.0 (Official Release)"
          body: |
            ## 🛡️ NetMuzzle v1.3.0

            Ultra-lightweight, zero-CPU, no-root Android firewall & Game AdBlocker.  
            *Super-lekki firewall i bloker reklam w grach na Androida bez roota i bez drenowania baterii.*

            ---

            ### 🇬🇧 English

            #### 📦 Download
            - **[NetMuzzle-v1.3.0.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.3.0/NetMuzzle-v1.3.0.apk)** (~1.2 MB) — Direct standalone APK ready to install on your Android device (Android 8.0 Oreo up to Android 14+).
            - **NetMuzzle-v1.3.0.aab** — Google Play production App Bundle.

            #### ✨ What's New in v1.3.0
            - 📡 **Live Game Ad & Traffic Inspector:** Real-time DNS inspection for games. Detect ad networks live when ads appear, see suspicious keyword tags, and block them with a single click.
            - 🔄 **Mandatory & Serverless Update Verification:** Client auto-update verification via GitHub ensuring apps stay updated while keeping active firewall protection running continuously.
            - 🌍 **Complete Localization (EN & PL):** Native Polish and English support across all dialogs and settings.
            - 🎮 **Game Ad-Blocking Shield:** Low-latency, zero-battery-drain domain filtering (Unity Ads, AdMob, AppLovin, IronSource, Vungle, etc.).
            - ⚙️ **AdBlock Filters Manager:** Selective ad network unblocking for in-game video rewards (Rewarded Ads).

            ---

            ### 🇵🇱 Polski

            #### 📦 Pobierz
            - **[NetMuzzle-v1.3.0.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.3.0/NetMuzzle-v1.3.0.apk)** (~1.2 MB) — Gotowy plik instalacyjny APK na smartfon z Androidem (Android 8.0 Oreo do Android 14+).
            - **NetMuzzle-v1.3.0.aab** — Oficjalna paczka produkcyjna dla Google Play.

            #### ✨ Nowości w wersji 1.3.0
            - 📡 **Inspektor Ruchu i Reklam w grach:** Podgląd zapytań DNS na żywo podczas grania. Błyskawiczne wykrywanie serwerów reklamowych w momencie pojawienia się reklamy i blokowanie 1 kliknięciem.
            - 🔄 **System weryfikacji i wymuszania aktualizacji:** Zabezpieczenie integralności aplikacji oparte o GitHub z nieprzerwaną ochroną w tle.
            - 🌍 **Pełna wielojęzyczność (PL i EN):** Natywne wsparcie dla języka polskiego i angielskiego.
            - 🎮 **Tarcza blokowania reklam w grach:** Zerowy drenaż baterii i brak lagów w grach sieciowych.
            - ⚙️ **Menedżer serwerów reklamowych:** Odblokowywanie wybranych sieci dla wideo z nagrodą (Rewarded Ads).
          files: |
            release-assets/NetMuzzle-v1.3.0.apk
            release-assets/NetMuzzle-v1.3.0.aab

