name: Build NetMuzzle APK & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala na ręczne uruchomienie w interfejsie GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build APKs and Google Play Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug/Release APKs and Google Play Bundle (.aab)
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Google Play Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-GooglePlay-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Optimized Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/NetMuzzle-v1.1.0.apk
          cp app/build/outputs/bundle/release/*.aab release-assets/NetMuzzle-v1.1.0.aab
          ls -lh release-assets/

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "NetMuzzle v1.1.0 (Official Release)"
          body: |
            ## 🛡️ NetMuzzle v1.1.0

            Ultra-lightweight, zero-CPU, no-root Android firewall & Game AdBlocker.  
            *Super-lekki firewall i bloker reklam w grach na Androida bez roota i bez drenowania baterii.*

            ---

            ### 🇬🇧 English

            #### 📦 Download
            - **[NetMuzzle-v1.1.0.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.1.0/NetMuzzle-v1.1.0.apk)** (~1.2 MB) — Direct standalone APK ready to install on your Android device (Android 8.0 Oreo up to Android 14+).
            - **NetMuzzle-v1.1.0.aab** — Google Play production App Bundle.

            #### ✨ What's New in v1.1.0
            - 🎮 **Game Ad-Blocking Shield:** Selective domain-based ad blocking (Unity Ads, AdMob, AppLovin, IronSource, etc.) while games stay online with 0 lag and 0 battery drain.
            - 💊 **3-State Segmented Capsule UI:** Easily toggle apps between `Allow` (Bypass), `Block Ads` (Game Shield), and `Muzzle` (Full Blackhole).
            - ⚙️ **AdBlock Filters Manager:** Unblock specific ad networks (e.g. Unity Ads) to enable in-game video rewards (Rewarded Ads) whenever you want, plus add your own custom ad domains.
            - ⚡ **Hero Master Switch:** Bold, interactive master protection control right at your fingertips.
            - ❓ **In-App Tutorial & Help:** Interactive guide explaining icons, filters, and battery performance.

            🌐 **Website / Landing Page:** [https://mastai-dev.github.io/NetMuzzle/](https://mastai-dev.github.io/NetMuzzle/)  
            🛡️ **Privacy Policy:** [https://mastai-dev.github.io/NetMuzzle/privacy.html](https://mastai-dev.github.io/NetMuzzle/privacy.html)

            ---

            ### 🇵🇱 Polski

            #### 📦 Pobierz
            - **[NetMuzzle-v1.1.0.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.1.0/NetMuzzle-v1.1.0.apk)** (~1.2 MB) — Gotowy plik instalacyjny APK na smartfon z Androidem (Android 8.0 Oreo do Android 14+).
            - **NetMuzzle-v1.1.0.aab** — Oficjalna paczka produkcyjna dla Google Play.

            #### ✨ Nowości w wersji 1.1.0
            - 🎮 **Blokada reklam w grach (Game Shield):** Selektywne wycinanie reklam (Unity Ads, AdMob, AppLovin itp.) bez zrywania połączeń z serwerami gier i bez drenowania baterii.
            - 💊 **Nowoczesna kapsuła 3-stanowa:** Błyskawiczny wybór trybu: `Zezwalaj`, `Tylko Ads` oraz `Kaganiec`.
            - ⚙️ **Menedżer serwerów reklamowych:** Możliwość odblokowania sieci (np. Unity Ads), aby zbierać darmowe monety/życia za wideo z nagrodą (Rewarded Ads) oraz dodawanie własnych domen.
            - ⚡ **Wyrazisty Główny Włącznik:** Nowy Hero Card ze stanem ochrony.
            - ❓ **Wbudowany samouczek:** Wyjaśnienie ikon i trybów wewnątrz aplikacji.

            🌐 **Strona projektu (Landing Page):** [https://mastai-dev.github.io/NetMuzzle/](https://mastai-dev.github.io/NetMuzzle/)  
            🛡️ **Polityka Prywatności:** [https://mastai-dev.github.io/NetMuzzle/privacy.html](https://mastai-dev.github.io/NetMuzzle/privacy.html)
          files: |
            release-assets/NetMuzzle-v1.1.0.apk
            release-assets/NetMuzzle-v1.1.0.aab

