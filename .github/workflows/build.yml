name: Build NetMuzzle APK & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala na ręczne uruchomienie w interfejsie GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build APKs and Google Play Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug/Release APKs and Google Play Bundle (.aab)
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Google Play Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-GooglePlay-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Optimized Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/NetMuzzle-v1.3.1.apk
          cp app/build/outputs/bundle/release/*.aab release-assets/NetMuzzle-v1.3.1.aab
          ls -lh release-assets/

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.1
          name: "NetMuzzle v1.3.1 (Official Release)"
          body: |
            ## 🛡️ NetMuzzle v1.3.1

            Ultra-lightweight, zero-CPU, no-root Android firewall & Game AdBlocker.  
            *Super-lekki firewall i bloker reklam w grach na Androida bez roota i bez drenowania baterii.*

            ---

            ### 🇬🇧 English

            #### 📦 Download
            - **[NetMuzzle-v1.3.1.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.3.1/NetMuzzle-v1.3.1.apk)** (~1.2 MB) — Direct standalone APK ready to install on your Android device (Android 8.0 Oreo up to Android 14+).
            - **NetMuzzle-v1.3.1.aab** — Google Play production App Bundle.

            #### ✨ What's New in v1.3.1
            - ⚡ **Critical DNS Routing & Sniffer Fix:** Fixed TUN gateway IP routing (`10.0.0.1` vs local IP loopback) so that game DNS queries are delivered directly into userspace TUN and displayed in the Traffic Inspector.
            - 📡 **Ad Provider & Mediation Support:** Ensured queries from Google Play Services (GMS), WebView, and system mediators on behalf of games are captured without being dropped.
            - 🛡️ **Protection Status in Inspector:** Added warning and 1-click protection activation directly inside the Traffic Inspector dialog if the master switch was OFF.
            - 🔄 **Resilient Upstream Fallback:** Automatic failover to backup DNS (`8.8.8.8`) if primary upstream DNS times out.
            - 🌐 **IPv6 Checksum Compliance:** Implemented full RFC 8200 UDP checksum calculation preventing Linux kernel packet drops.

            ---

            ### 🇵🇱 Polski

            #### 📦 Pobierz
            - **[NetMuzzle-v1.3.1.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.3.1/NetMuzzle-v1.3.1.apk)** (~1.2 MB) — Gotowy plik instalacyjny APK na smartfon z Androidem (Android 8.0 Oreo do Android 14+).
            - **NetMuzzle-v1.3.1.aab** — Oficjalna paczka produkcyjna dla Google Play.

            #### ✨ Nowości w wersji 1.3.1
            - ⚡ **Kluczowa poprawka przechwytywania DNS i Radaru:** Poprawiono trasowanie bramy DNS w tunelu (`10.0.0.1` zamiast lokalnego IP interfejsu), dzięki czemu zapytania z gier trafiają do Inspektora Ruchu, a reklamy nie wyciekają do domyślnego DNS.
            - 📡 **Wsparcie dla Google Play Services (GMS) i WebView:** Zapytania z bibliotek reklamowych wywoływane w tle nie są już odrzucane przez filtr pakietu.
            - 🛡️ **Stan ochrony w dialogu:** Wyraźne ostrzeżenie i przycisk włączenia ochrony bezpośrednio w Inspektorze Ruchu, gdy główny włącznik jest wyłączony.
            - 🔄 **Zapasowy serwer DNS:** Automatyczne przełączenie na zapasowy upstream (`8.8.8.8`) w razie problemów z łączem.
            - 🌐 **Zgodność z RFC 8200 dla IPv6:** Poprawne sumy kontrolne UDP dla IPv6 zapobiegające odrzucaniu pakietów przez jądro Linux.
          files: |
            release-assets/NetMuzzle-v1.3.1.apk
            release-assets/NetMuzzle-v1.3.1.aab

