name: Build NetMuzzle APK & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala na ręczne uruchomienie w interfejsie GitHub

jobs:
  build:
    name: Build APKs and Google Play Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug/Release APKs and Google Play Bundle (.aab)
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Google Play Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-GooglePlay-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Optimized Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
