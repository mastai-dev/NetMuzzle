name: Build NetMuzzle APK & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala na ręczne uruchomienie w interfejsie GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build APKs and Google Play Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug/Release APKs and Google Play Bundle (.aab)
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Google Play Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-GooglePlay-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Optimized Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/NetMuzzle-v1.2.1.apk
          cp app/build/outputs/bundle/release/*.aab release-assets/NetMuzzle-v1.2.1.aab
          ls -lh release-assets/

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: "NetMuzzle v1.2.1 (Official Release)"
          body: |
            ## 🛡️ NetMuzzle v1.2.1

            Ultra-lightweight, zero-CPU, no-root Android firewall & Game AdBlocker.  
            *Super-lekki firewall i bloker reklam w grach na Androida bez roota i bez drenowania baterii.*

            ---

            ### 🇬🇧 English

            #### 📦 Download
            - **[NetMuzzle-v1.2.1.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.2.1/NetMuzzle-v1.2.1.apk)** (~1.2 MB) — Direct standalone APK ready to install on your Android device (Android 8.0 Oreo up to Android 14+).
            - **NetMuzzle-v1.2.1.aab** — Google Play production App Bundle.

            #### ✨ What's New in v1.2.1
            - 🌍 **Per-App Language Settings (Android 13+):** Enabled system-level language selection in Android Settings (`locales_config.xml`) plus an in-app language switcher (English / Polski).
            - 🎨 **Modern 3-State Segmented Pill UI:** Clear text labels (`Allow`, `Block Ads`, `Muzzle`) with glowing status outlines and tactile feedback.
            - 🔍 **Expanded 4-Way Filtering Bar:** Filter apps instantly by `All`, `🎮 Games`, `🛡️ Block Ads`, or `🚫 Muzzled` with live application counters.
            - 📱 **Enhanced App Card Design:** Clean layout with large 46dp icons, glowing gamepad badges, and full-width mode selectors.
            - 🎮 **Game Ad-Blocking Shield:** Selective domain-based ad blocking (Unity Ads, AdMob, AppLovin, IronSource, etc.) while games stay online with 0 lag and 0 battery drain.
            - ⚙️ **AdBlock Filters Manager:** Unblock specific ad networks (e.g. Unity Ads) to enable in-game video rewards (Rewarded Ads) whenever you want, plus add your own custom ad domains.
            - ⚡ **Hero Master Switch:** Bold, interactive master protection control right at your fingertips.
            - ❓ **In-App Tutorial & Help:** Interactive guide explaining icons, filters, and battery performance.

            🌐 **Website / Landing Page:** [https://mastai-dev.github.io/NetMuzzle/](https://mastai-dev.github.io/NetMuzzle/)  
            🛡️ **Privacy Policy:** [https://mastai-dev.github.io/NetMuzzle/privacy.html](https://mastai-dev.github.io/NetMuzzle/privacy.html)

            ---

            ### 🇵🇱 Polski

            #### 📦 Pobierz
            - **[NetMuzzle-v1.2.1.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.2.1/NetMuzzle-v1.2.1.apk)** (~1.2 MB) — Gotowy plik instalacyjny APK na smartfon z Androidem (Android 8.0 Oreo do Android 14+).
            - **NetMuzzle-v1.2.1.aab** — Oficjalna paczka produkcyjna dla Google Play.

            #### ✨ Nowości w wersji 1.2.1
            - 🌍 **Wybór języka aplikacji (Android 13+):** Włączono systemowy wybór języka w Ustawieniach Androida (`locales_config.xml`) oraz dodano przełącznik języka bezpośrednio w menu aplikacji (Polski / English).
            - 🎨 **Nowoczesna tekstowa kapsuła 3-stanowa:** Czytelne etykiety (`Zezwalaj`, `Tylko Ads`, `Kaganiec`) z neonowym podświetleniem wybranego trybu.
            - 🔍 **Rozbudowany pasek 4 filtrów:** Błyskawiczne filtrowanie według kategorii: `Wszystkie`, `🎮 Gry`, `🛡️ Blokada Ads` oraz `🚫 Kaganiec` z dynamicznymi licznikami.
            - 📱 **Dopracowane kafelki aplikacji:** Duże ikony (46dp), plakietki gier i pełnowymiarowy selektor trybów bez ryzyka ucięć.
            - 🎮 **Blokada reklam w grach (Game Shield):** Selektywne wycinanie reklam (Unity Ads, AdMob, AppLovin itp.) bez zrywania połączeń z serwerami gier i bez drenowania baterii.
            - ⚙️ **Menedżer serwerów reklamowych:** Możliwość odblokowania sieci (np. Unity Ads), aby zbierać darmowe monety/życia za wideo z nagrodą (Rewarded Ads) oraz dodawanie własnych domen.
            - ⚡ **Wyrazisty Główny Włącznik:** Hero Card ze statystykami i stanem ochrony w czasie rzeczywistym.
            - ❓ **Wbudowany samouczek:** Wyjaśnienie ikon i trybów wewnątrz aplikacji.

            🌐 **Strona projektu (Landing Page):** [https://mastai-dev.github.io/NetMuzzle/](https://mastai-dev.github.io/NetMuzzle/)  
            🛡️ **Polityka Prywatności:** [https://mastai-dev.github.io/NetMuzzle/privacy.html](https://mastai-dev.github.io/NetMuzzle/privacy.html)
          files: |
            release-assets/NetMuzzle-v1.2.1.apk
            release-assets/NetMuzzle-v1.2.1.aab

