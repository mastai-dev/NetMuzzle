name: Build NetMuzzle APK & Google Play Bundle

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Pozwala na ręczne uruchomienie w interfejsie GitHub

permissions:
  contents: write

jobs:
  build:
    name: Build APKs and Google Play Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug/Release APKs and Google Play Bundle (.aab)
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Google Play Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-GooglePlay-Bundle-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Optimized Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Debug APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: NetMuzzle-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp app/build/outputs/apk/release/*.apk release-assets/NetMuzzle-v1.0.0.apk
          cp app/build/outputs/bundle/release/*.aab release-assets/NetMuzzle-v1.0.0.aab
          ls -lh release-assets/

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "NetMuzzle v1.0.0 (Official Release)"
          body: |
            ## 🛡️ NetMuzzle v1.0.0

            Ultra-lightweight, zero-CPU, no-root Android firewall application.  
            *Super-lekki firewall na Androida bez roota i bez drenowania baterii.*

            ---

            ### 🇬🇧 English

            #### 📦 Download
            - **[NetMuzzle-v1.0.0.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.0.0/NetMuzzle-v1.0.0.apk)** (~1.2 MB) — Direct standalone APK ready to install on your Android device (Android 8.0 Oreo up to Android 14+).
            - **NetMuzzle-v1.0.0.aab** — Google Play production App Bundle.

            #### ✨ Key Features
            - 🔒 **Selective Blackholing:** Cut off internet access for chosen apps (intrusive games, telemetry, ad-trackers).
            - ⚡ **0% CPU Overhead:** Allowed apps bypass the VPN engine directly at the Linux kernel level (`addAllowedApplication`).
            - 🔋 **Zero Battery Drain:** No packet inspection loop, no TLS decryption, no heavy background processing.
            - 🛡️ **Zero DNS Leaks:** Dead loopback sink (IPv4 & IPv6) rejects DNS queries from blocked apps on-device.
            - 🌍 **Bilingual Support:** Automatically switches between English and Polish based on your device language.
            - 💎 **100% Free & Open Source:** Licensed under the MIT License by Marcin Stankiewicz.

            🌐 **Website / Landing Page:** [https://mastai-dev.github.io/NetMuzzle/](https://mastai-dev.github.io/NetMuzzle/)  
            🛡️ **Privacy Policy:** [https://mastai-dev.github.io/NetMuzzle/privacy.html](https://mastai-dev.github.io/NetMuzzle/privacy.html)

            ---

            ### 🇵🇱 Polski

            #### 📦 Pobierz
            - **[NetMuzzle-v1.0.0.apk](https://github.com/mastai-dev/NetMuzzle/releases/download/v1.0.0/NetMuzzle-v1.0.0.apk)** (~1.2 MB) — Gotowy plik instalacyjny APK na smartfon z Androidem (Android 8.0 Oreo do Android 14+).
            - **NetMuzzle-v1.0.0.aab** — Oficjalna paczka produkcyjna dla Google Play.

            #### ✨ Najważniejsze funkcje
            - 🔒 **Blokada internetu dla aplikacji:** Odcina łączność sieciową tylko dla wybranych przez Ciebie programów.
            - ⚡ **0% obciążenia procesora:** Dopuszczony ruch (99%) omija aplikację bezpośrednio na poziomie jądra systemu Linux.
            - 🔋 **Zero drenażu baterii:** Brak analizowania pakietów, brak deszyfrowania TLS i brak ciężkich procesów w tle.
            - 🛡️ **Zero wycieków DNS:** Pętla blackhole sink pochłania zapytania DNS zablokowanych apek natychmiast na telefonie.
            - 🌍 **W pełni po polsku:** Automatyczne wykrywanie języka polskiego w telefonie.
            - 💎 **100% Darmowy & Open Source:** Na otwartej licencji MIT (autor: Marcin Stankiewicz).

            🌐 **Strona projektu (Landing Page):** [https://mastai-dev.github.io/NetMuzzle/](https://mastai-dev.github.io/NetMuzzle/)  
            🛡️ **Polityka Prywatności:** [https://mastai-dev.github.io/NetMuzzle/privacy.html](https://mastai-dev.github.io/NetMuzzle/privacy.html)
          files: |
            release-assets/NetMuzzle-v1.0.0.apk
            release-assets/NetMuzzle-v1.0.0.aab

